[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverly"
version = "0.1.0"
description = "A decisioning pipeline for failed-payment recovery."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=1.0,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.40,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["backend", "backend.data"]
